router bgp 100
  bgp router-id 100.100.1.1
  no bgp ebgp-requires-policy
  no bgp network import-check

  neighbor 8.2.1.2 remote-as 300
  neighbor 8.2.1.2 weight 100
  neighbor 8.2.1.3 remote-as 400

  address-family ipv4 unicast
    network 8.1.1.101/32
    network 8.1.1.102/32
  exit-address-family
